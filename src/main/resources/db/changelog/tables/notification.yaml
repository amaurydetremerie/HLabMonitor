databaseChangeLog:
  - changeSet:
      id: 7-create-notification-table
      author: adetremerie
      changes:
        - createTable:
            tableName: NOTIFICATION
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_result
                    nullable: false
              - column:
                  name: target_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: notification_status
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: old_result
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: new_result
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: fire_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: resolved_at
                  type: BIGINT
                  constraints:
                    nullable: true
      rollback:
        - dropTable:
            tableName: NOTIFICATION