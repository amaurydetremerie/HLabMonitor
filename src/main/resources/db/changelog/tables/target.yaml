databaseChangeLog:
  - changeSet:
      id: 1-create-target-table
      author: adetremerie
      changes:
        - createTable:
            tableName: TARGET
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_target
                    nullable: false
              - column:
                  name: target_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: target
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(255)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: TARGET
  - changeSet:
      id: 6-add-acceptable_status_code
      author: adetremerie
      changes:
        - addColumn:
            tableName: TARGET
            columns:
              - column:
                  name: acceptable_status_code
                  type: integer
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: TARGET
            columnName: acceptable_status_code
  - changeSet:
      id: 7-add-speedtest-columns
      author: adetremerie
      changes:
        - addColumn:
            tableName: TARGET
            columns:
              - column:
                  name: speedtest_type
                  type: varchar(50)
                  constraints:
                    nullable: true
        - addColumn:
            tableName: TARGET
            columns:
              - column:
                  name: warning_threshold_mbps
                  type: decimal(10,3)
                  constraints:
                    nullable: true
        - addColumn:
            tableName: TARGET
            columns:
              - column:
                  name: failure_threshold_mbps
                  type: decimal(10,3)
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: TARGET
            columnName: speedtest_type
        - dropColumn:
            tableName: TARGET
            columnName: warning_threshold_mbps
        - dropColumn:
            tableName: TARGET
            columnName: failure_threshold_mbps