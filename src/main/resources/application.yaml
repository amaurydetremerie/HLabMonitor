spring:
  application:
    name: HLabMonitor
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
logging:
  level:
    root: ERROR
    be.wiserisk.hlabmonitor.monitor.infrastructure.adapter.in.notification.LogSender: TRACE
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

debug:
  controller:
    enabled: false
database:
  type: h2